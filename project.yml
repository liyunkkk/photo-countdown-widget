name: PhotoWidget
options:
  bundleIdPrefix: com.qingxu
  deploymentTarget:
    iOS: "16.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  PhotoWidget:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 照片倒计时
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: PhotoWidgetExtension
        embed: true
  PhotoWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 照片倒计时组件
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  PhotoWidget:
    build:
      targets:
        PhotoWidget: all
